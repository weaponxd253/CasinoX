<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette Royale — Casino X</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../casino-shell.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="roulette-game" class="game-stage">
    <div class="roulette-title">
      <p class="table-kicker">European single zero</p>
      <h1>Roulette Royale</h1>
      <p class="tagline">Place your chips, spin the wheel, and let the ivory ball decide.</p>
    </div>

    <section class="roulette-layout">
      <div class="wheel-panel">
        <div class="wheel-wrap">
          <div class="wheel" id="wheel">
            <div class="wheel-ring"></div>
            <div class="wheel-center">
              <span id="wheel-number">--</span>
            </div>
          </div>
          <div class="ball-track">
            <span class="ball" id="ball"></span>
          </div>
        </div>

        <div class="result-strip">
          <span class="result-label">Last Spin</span>
          <strong id="spin-result">Place your bets</strong>
        </div>
      </div>

      <div class="bet-panel panel">
        <div class="panel-head">
          <div>
            <span class="micro-label">Current Wager</span>
            <strong id="bet-display">$5.00</strong>
          </div>
          <button class="icon-action" id="help-btn" aria-label="Open roulette rules" title="Rules">
            <i class="fa-solid fa-circle-question"></i>
          </button>
        </div>

        <div class="chip-row" aria-label="Choose wager">
          <button class="chip-btn" data-bet="1">$1</button>
          <button class="chip-btn active" data-bet="5">$5</button>
          <button class="chip-btn" data-bet="10">$10</button>
          <button class="chip-btn" data-bet="25">$25</button>
          <button class="chip-btn" data-bet="50">$50</button>
        </div>

        <div class="betting-board" id="number-board" aria-label="Straight number bets"></div>

        <div class="outside-bets" aria-label="Outside bets">
          <button class="outside-bet red" data-bet-type="color" data-bet-value="red">Red</button>
          <button class="outside-bet black" data-bet-type="color" data-bet-value="black">Black</button>
          <button class="outside-bet" data-bet-type="parity" data-bet-value="even">Even</button>
          <button class="outside-bet" data-bet-type="parity" data-bet-value="odd">Odd</button>
          <button class="outside-bet" data-bet-type="range" data-bet-value="low">1-18</button>
          <button class="outside-bet" data-bet-type="range" data-bet-value="high">19-36</button>
          <button class="outside-bet" data-bet-type="dozen" data-bet-value="1">1st 12</button>
          <button class="outside-bet" data-bet-type="dozen" data-bet-value="2">2nd 12</button>
          <button class="outside-bet" data-bet-type="dozen" data-bet-value="3">3rd 12</button>
        </div>

        <div class="selected-ticket">
          <span class="micro-label">Ticket</span>
          <strong id="ticket-label">Red</strong>
          <span id="ticket-payout">Pays 1:1</span>
        </div>

        <div class="action-row">
          <button class="btn primary" id="spin-btn">
            <i class="fa-solid fa-arrows-spin"></i> Spin
          </button>
          <button class="btn secondary" id="clear-btn">Clear</button>
        </div>
      </div>
    </section>

    <section class="history-panel">
      <div class="history-head">
        <h2>Recent Results</h2>
        <span id="streak-note">No spins yet</span>
      </div>
      <ol id="history-list" class="history-list"></ol>
    </section>
  </main>

  <script src="../wallet.js"></script>
  <script src="../casino-shell.js"></script>
  <script src="game.js"></script>
</body>
</html>
