<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Reels — Casino X</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Shell first, game styles second -->
  <link rel="stylesheet" href="../casino-shell.css?v=2026.10.1-p2">
  <link rel="stylesheet" href="styles.css?v=2026.10.1-p2">
  <link rel="stylesheet" href="../casino-mobile.css?v=2026.10.1-p2">


  <!-- Served locally so a CDN outage can't stall a paid spin -->
  <script src="../vendor/gsap-3.9.1.min.js?v=2026.10.1-p2"></script>
</head>

<body>
  <!-- The shell injects the header, modals and overlays. -->

  <main class="game-stage">
    <h1>Slot Machine</h1>

    <!-- Reels -->
    <div class="slot-machine">
      <div class="reel" id="reel-0">
        <div class="icon-container"></div>
      </div>
      <div class="reel" id="reel-1">
        <div class="icon-container"></div>
      </div>
      <div class="reel" id="reel-2">
        <div class="icon-container"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="bet-buttons" role="group" aria-label="Bet amount">
        <button class="pushable" type="button" data-bet="0.6" aria-label="Bet 60 cents"><span class="front">60¢</span></button>
        <button class="pushable" type="button" data-bet="1.2" aria-label="Bet 1 dollar 20"><span class="front">$1.20</span></button>
        <button class="pushable" type="button" data-bet="2.4" aria-label="Bet 2 dollars 40"><span class="front">$2.40</span></button>
        <button class="pushable" type="button" data-bet="3.6" aria-label="Bet 3 dollars 60"><span class="front">$3.60</span></button>
        <button class="pushable" type="button" data-bet="6" aria-label="Bet 6 dollars, maximum bet"><span class="front">$6.00<span class="bet-max-tag"> Max</span></span></button>
      </div>

      <div id="bet-display" class="digital-screen small-screen">
        🎲 Current Bet: $<span id="current-bet">0.60</span>
      </div>

      <div class="button-container">
        <button class="button spin-button" aria-label="Spin the reels" title="Spin (or press Space)">
          <i class="fa-solid fa-arrows-rotate spin-icon"></i>
        </button>
        <button id="reset-button" class="reset-button" aria-label="Cashier — refills and hotel comps"
          title="Cashier · refills and hotel comps">
          <i class="fa-solid fa-circle-dollar-to-slot"></i>
        </button>
        <button id="help" class="help-button" aria-label="Open help guide" title="How to play">
          <i class="fa-solid fa-question help-icon"></i>
        </button>
      </div>
    </div>

    <!-- Result display -->
    <div id="winnings-display" class="digital-screen">
      <div id="result" class="result">🎉 Welcome! 🎉</div>
    </div>

    <!-- Spin history -->
    <div id="history-container" class="history-container">
      <h3>Recent Spins</h3>
      <ul id="history-list" class="history-list">
        <li class="history-empty">No spins yet — give it a go!</li>
      </ul>
    </div>

    <!-- Winning combinations table -->
    <h2>Winning Combinations</h2>
    <!-- Rows are built from the payout table in script.js -->
    <table class="winning-chart">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>3 of a kind</th>
          <th>2 of a kind</th>
          <th>At $<span id="max-bet-display"></span> bet</th>
        </tr>
      </thead>
      <tbody id="paytable-body"></tbody>
    </table>
    <p class="paytable-note">Three of a kind pays the full multiplier, two of a kind pays half. Returns about 95% of wagers over time.</p>
  </main>

  <script src="../wallet.js?v=2026.10.1-p2"></script>
  <script src="../casino-shell.js?v=2026.10.1-p2"></script>
  <script src="../hotel-events.js?v=2026.10.1-p2"></script>
  <script src="../hotel-perks.js?v=2026.10.1-p2"></script>
  <script src="script.js?v=2026.10.1-p2"></script>
</body>

</html>
