<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Run a hotel and play its casino: slots, blackjack, roulette and six hotel shifts. A free browser game. Simulated, no real money.">
  <meta name="theme-color" content="#0e4a2c">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Coin Flip — Casino X</title>

  <link rel="stylesheet" href="../vendor/fonts/fonts.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="../vendor/fontawesome/css/fa.min.css?v=2026.10.6-s2">

  <!-- Shell first, game styles second -->
  <link rel="stylesheet" href="../casino-shell.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="styles.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="../casino-mobile.css?v=2026.10.6-s2">

</head>

<body>
  <!-- The shell injects the header, modals and overlays automatically. -->

  <main id="game" class="game-stage">
    <h1>Coin Flip</h1>
    <p class="tagline">Pick a side. Win and your bet doubles — then let it ride or cash out.</p>

    <div class="coin" id="coin">
      <div class="coin-face coin-heads">♛</div>
      <div class="coin-face coin-tails">✦</div>
    </div>

    <div id="cf-result" class="cf-result">Place your bet</div>

    <div class="bet-row panel">
      <button class="btn secondary" id="bet-minus">−</button>
      <div class="bet-box"><span class="bet-label">Bet</span><span class="bet-val" id="bet-val">$5.00</span></div>
      <button class="btn secondary" id="bet-plus">+</button>
    </div>

    <div class="ride-panel" id="ride-panel" hidden aria-live="polite">
      <span class="ride-label">Pot</span>
      <strong class="ride-pot" id="ride-pot">$0.00</strong>
      <span class="ride-next" id="ride-next"></span>
      <button class="btn secondary" id="cash-out" type="button">Cash out</button>
    </div>

    <div class="choice-row">
      <button class="btn primary" id="flip-heads">Bet Heads ♛</button>
      <button class="btn primary" id="flip-tails">Bet Tails ✦</button>
    </div>
  </main>

  <script src="../safe-storage.js?v=2026.10.6-s2"></script>
  <script src="../wallet.js?v=2026.10.6-s2"></script>
  <script src="../casino-shell.js?v=2026.10.6-s2"></script>
  <script src="../hotel-events.js?v=2026.10.6-s2"></script>
  <script src="../hotel-perks.js?v=2026.10.6-s2"></script>
  <script src="game.js?v=2026.10.6-s2"></script>
</body>

</html>
