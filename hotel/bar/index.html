<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Run a hotel and play its casino: slots, blackjack, roulette and six hotel shifts. A free browser game. Simulated, no real money.">
  <meta name="theme-color" content="#0e4a2c">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <title>Bar Shift — Casino X Hotel</title>

  <link rel="stylesheet" href="../../vendor/fonts/fonts.css?v=2026.10.6-s1">
  <link rel="stylesheet" href="../../vendor/fontawesome/css/fa.min.css?v=2026.10.6-s1">

  <link rel="stylesheet" href="../../casino-shell.css?v=2026.10.6-s1">
  <link rel="stylesheet" href="bar.css?v=2026.10.6-s1">
  <link rel="stylesheet" href="../shift-briefing.css?v=2026.10.6-s1">

  <script src="../../safe-storage.js?v=2026.10.6-s1"></script>
  <script src="../../wallet.js?v=2026.10.6-s1"></script>
  <script src="../../casino-shell.js?v=2026.10.6-s1"></script>
  <script src="../../hotel-events.js?v=2026.10.6-s1"></script>
  <script src="../../hotel-perks.js?v=2026.10.6-s1"></script>
  <script src="../hotel-config.js?v=2026.10.6-s1"></script>
  <script src="../hotel-state.js?v=2026.10.6-s1"></script>
  <script src="../hotel-engine.js?v=2026.10.6-s1"></script>
  <script src="../hotel-bridge.js?v=2026.10.6-s1"></script>
  <script src="../shift-twists.js?v=2026.10.6-s1"></script>
  <script src="../shift-briefing.js?v=2026.10.6-s1"></script>
  <script src="bar-game.js?v=2026.10.6-s1"></script>
</head>
<body>
  <main class="game-stage bar-shift-shell">
    <div class="bar-topline">
      <div class="bar-hotel-cash">
        <span><i class="fa-solid fa-building" aria-hidden="true"></i> Hotel Cash</span>
        $<strong id="bar-hotel-cash">0</strong>
      </div>
    </div>

    <section class="bar-shift-board" aria-label="Bar shift">
      <div class="bar-room">
        <div class="bar-shelves">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="bar-counter">
          <div class="bar-seats" id="bar-seats" aria-label="Guests at the counter"><!-- rendered by bar-game.js --></div>

          <div class="bar-build">
            <div class="order-ticket">
              <div class="ticket-label" id="ticket-label">Order</div>
              <div class="ticket-drink" id="ticket-drink">Ready</div>
              <div class="ticket-recipe" id="ticket-recipe"></div>
              <div class="patience-track">
                <div class="patience-fill" id="patience-fill"></div>
              </div>
              <button class="recipe-book-btn" id="recipe-book-btn" type="button"><i class="fa-solid fa-book" aria-hidden="true"></i> Recipe book</button>
            </div>
            <div class="build-glass" aria-label="Your glass">
              <div class="ticket-label">In the glass</div>
              <div class="glass-contents" id="glass-contents" aria-live="polite"></div>
              <div class="glass-actions">
                <button class="glass-dump" id="dump-btn" type="button" disabled>Empty</button>
                <button class="glass-serve" id="serve-btn" type="button" disabled>Serve</button>
              </div>
            </div>
          </div>

          <div class="drink-station ingredient-rail" id="drink-station" aria-label="Ingredients"><!-- rendered by bar-game.js --></div>
        </div>
      </div>

      <aside class="shift-panel">
        <div class="shift-title">
          <i class="fa-solid fa-martini-glass-citrus"></i>
          Bar Shift
        </div>

        <div class="shift-next-step next-step-panel" id="bar-next-step">
          <span>Next Step</span>
          <strong>Start Bar Shift to open the first ticket.</strong>
        </div>

        <div class="shift-stats">
          <div>
            <span>Served</span>
            <strong class="served-ratio"><span id="served-count">0</span><span>/</span><span id="served-target">5</span></strong>
          </div>
          <div>
            <span>Tips</span>
            <strong>$<span id="tips-total">0</span></strong>
          </div>
          <div>
            <span>Streak</span>
            <strong id="streak-count">0</strong>
          </div>
          <div>
            <span>Mood</span>
            <strong id="mood-label">Calm</strong>
          </div>
        </div>

        <div class="shift-results" id="shift-results" hidden>
          <div class="results-heading">
            <i class="fa-solid fa-receipt"></i>
            Shift Complete
          </div>
          <div class="results-grid">
            <div>
              <span>Tips</span>
              <strong>$<span id="result-tips">0</span></strong>
            </div>
            <div>
              <span>Orders</span>
              <strong id="result-orders">0</strong>
            </div>
            <div>
              <span>Misses</span>
              <strong id="result-misses">0</strong>
            </div>
            <div>
              <span>Satisfaction</span>
              <strong>+<span id="result-satisfaction">0</span></strong>
            </div>
          </div>
        </div>

        <div class="shift-log" id="shift-log"></div>

        <div class="shift-actions">
          <button class="primary-shift-btn" id="start-shift-btn" type="button">
            <i class="fa-solid fa-play"></i>
            Start Bar Shift
          </button>
          <a class="secondary-shift-btn" id="bar-return-link" href="../index.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Hotel Lobby
          </a>
        </div>
      </aside>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HotelState.init();
      CasinoShell.mount({
        name: 'Bar Shift',
        subtitle: 'Hotel Department',
        lobbyHref: '../../index.html',
        footer: 'Casino X · Bar Shift · Hotel Department'
      });
      BarGame.init();
    });
  </script>
</body>
</html>
