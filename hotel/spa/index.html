<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Run a hotel and play its casino: slots, blackjack, roulette and six hotel shifts. A free browser game. Simulated, no real money.">
  <meta name="theme-color" content="#0e4a2c">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <title>Spa Rush - Casino X Hotel</title>

  <link rel="stylesheet" href="../../vendor/fonts/fonts.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="../../vendor/fontawesome/css/fa.min.css?v=2026.10.6-s2">

  <link rel="stylesheet" href="../../casino-shell.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="spa.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="../../casino-mobile.css?v=2026.10.6-s2">
  <link rel="stylesheet" href="../shift-briefing.css?v=2026.10.6-s2">

  <script src="../../safe-storage.js?v=2026.10.6-s2"></script>
  <script src="../../wallet.js?v=2026.10.6-s2"></script>
  <script src="../../casino-shell.js?v=2026.10.6-s2"></script>
  <script src="../../hotel-events.js?v=2026.10.6-s2"></script>
  <script src="../../hotel-perks.js?v=2026.10.6-s2"></script>
  <script src="../hotel-config.js?v=2026.10.6-s2"></script>
  <script src="../hotel-state.js?v=2026.10.6-s2"></script>
  <script src="../hotel-engine.js?v=2026.10.6-s2"></script>
  <script src="../hotel-bridge.js?v=2026.10.6-s2"></script>
  <script src="../shift-twists.js?v=2026.10.6-s2"></script>
  <script src="../shift-briefing.js?v=2026.10.6-s2"></script>
  <script src="spa-game.js?v=2026.10.6-s2"></script>
</head>
<body>
  <main class="game-stage spa-rush-shell">
    <div class="spa-topline">
      <div class="spa-hotel-cash">
        <span><i class="fa-solid fa-building" aria-hidden="true"></i> Hotel Cash</span>
        $<strong id="spa-hotel-cash">0</strong>
      </div>
    </div>

    <section class="spa-board" aria-label="Spa Rush">
      <div class="spa-room">
        <div class="spa-room-header">
          <div>
            <span class="spa-kicker">Spa & Wellness</span>
            <h2 id="spa-tier-label">Wellness Room</h2>
          </div>
          <div class="spa-session-meter">
            <span>Time</span>
            <strong id="spa-time">1:00</strong>
            <div class="spa-session-track">
              <div class="spa-session-fill" id="spa-session-fill"></div>
            </div>
          </div>
        </div>

        <div class="spa-layout">
          <section class="spa-guests">
            <div class="spa-section-title spa-lounge-title">
              <span>Waiting Lounge</span>
              <button class="spa-menu-btn" id="spa-menu-btn" type="button"><i class="fa-solid fa-book" aria-hidden="true"></i> Treatment menu</button>
            </div>
            <div class="spa-lounge" id="spa-lounge" aria-label="Waiting guests"></div>
            <div class="guest-slots" id="guest-slots"></div>
          </section>

          <section class="spa-stations">
            <div class="spa-section-title">Treatment Rooms</div>
            <div class="station-grid" id="station-grid"></div>
          </section>
        </div>

        <section class="treatment-bar" id="treatment-bar" aria-label="Treatments"></section>
      </div>

      <aside class="spa-panel">
        <div class="spa-panel-title">
          <i class="fa-solid fa-spa"></i>
          Spa Rush
        </div>

        <div class="spa-next-step next-step-panel" id="spa-next-step">
          <span>Next Step</span>
          <strong>Start Spa Rush to seat waiting guests.</strong>
        </div>

        <div class="spa-outcome" id="spa-outcome" hidden></div>

        <div class="spa-stats">
          <div>
            <span>Guests</span>
            <strong><span id="spa-served">0</span>/<span id="spa-target">8</span></strong>
          </div>
          <div>
            <span>Cash</span>
            <strong>$<span id="spa-earned">0</span></strong>
          </div>
          <div>
            <span>Perfect</span>
            <strong id="spa-perfect">0</strong>
          </div>
          <div>
            <span>Mood</span>
            <strong id="spa-mood">Calm</strong>
          </div>
        </div>

        <div class="spa-boost">
          <div class="spa-boost-top">
            <span>Satisfaction Bonus</span>
            <strong>+<span id="spa-sat-preview">0</span></strong>
          </div>
          <div class="spa-boost-track">
            <div id="spa-boost-fill"></div>
          </div>
        </div>

        <div class="spa-results" id="spa-results" hidden>
          <div class="results-heading">
            <i class="fa-solid fa-receipt"></i>
            Session Complete
          </div>
          <div class="results-grid">
            <div><span>Cash</span><strong>$<span id="result-cash">0</span></strong></div>
            <div><span>Treated</span><strong id="result-treated">0</strong></div>
            <div><span>Walkouts</span><strong id="result-walkouts">0</strong></div>
            <div><span>Satisfaction</span><strong>+<span id="result-sat">0</span></strong></div>
          </div>
        </div>

        <div class="spa-log" id="spa-log"></div>

        <div class="spa-actions">
          <button class="primary-spa-btn" id="start-spa-btn" type="button">
            <i class="fa-solid fa-play"></i>
            Start Spa Rush
          </button>
          <a class="secondary-spa-btn" id="spa-return-link" href="../index.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Hotel Lobby
          </a>
        </div>
      </aside>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HotelState.init();
      CasinoShell.mount({
        name: 'Spa Rush',
        subtitle: 'Hotel Department',
        lobbyHref: '../../index.html',
        footer: 'Casino X - Spa Rush - Hotel Department'
      });
      SpaRush.init();
    });
  </script>
</body>
</html>
