<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Manager — Casino X</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Shell + mobile + hotel styles -->
  <link rel="stylesheet" href="../casino-shell.css">
  <link rel="stylesheet" href="../casino-mobile.css">
  <link rel="stylesheet" href="hotel.css">

  <!-- Game data + state + engine — MUST load before hotel-ui.js -->
  <script src="../wallet.js"></script>
  <script src="../casino-shell.js"></script>
  <script src="hotel-config.js"></script>
  <script src="hotel-state.js"></script>
  <script src="hotel-engine.js"></script>
  <script src="hotel-bridge.js"></script>
  <script src="hotel-ui.js"></script>
</head>

<body>
  <!--
    Shell header is injected by CasinoShell.standalone() in hotel-ui.js.
    It inserts above this comment's sibling elements.
  -->

  <!-- ── Hotel cash pill (separate from casino chips) ── -->
  <div class="hotel-cash-bar">
    <div class="hotel-cash-pill" id="hotel-cash-pill" title="Hotel Cash — separate from casino chips">
      <i class="fa-solid fa-building"></i>
      $<span id="hotel-cash-amount">3,000</span>
      <span class="cash-label">Hotel Cash</span>
    </div>
    <div class="income-rate-display">
      <span class="income-label">Income</span>
      <span>$<span id="income-rate-value">125</span><span class="ipm">/min</span></span>
      <span class="income-boost-badge" id="income-boost-badge" style="display:none"></span>
    </div>
  </div>

  <!-- ── Main layout: building left · management right ── -->
  <div class="hotel-manager-layout">

    <!-- Left: CSS hotel building (Phase 3 replaces this with Pixi canvas) -->
    <div class="hotel-view-wrap">
      <div class="hotel-building-header">
        <span id="hotel-name-display" class="hotel-name" title="Click to rename">
          Grand Casino Resort
        </span>
        <span class="hotel-tier-badge" id="hotel-tier">Tier 1</span>
      </div>

      <!-- #hotel-canvas-wrap reserved for Phase 3 Pixi injection -->
      <div id="hotel-canvas-wrap">
        <div id="hotel-building-css" class="hotel-building-css">
          <!-- Rendered by HotelUI.renderBuildingView() -->
        </div>
      </div>

      <!-- Quick stats strip below the building -->
      <div class="building-stats-strip">
        <div class="bstat">
          <span class="bstat-label">Reputation</span>
          <span class="bstat-value" id="hotel-reputation">1</span>
        </div>
        <div class="bstat">
          <span class="bstat-label">Satisfaction</span>
          <div class="sat-mini">
            <div class="sat-bar-mini">
              <div class="sat-fill good" id="sat-fill" style="width:75%"></div>
            </div>
            <span id="sat-label-value">75%</span>
            <span class="sat-trend stable" id="sat-trend">→</span>
          </div>
        </div>
        <div class="bstat">
          <span class="bstat-label">Guests</span>
          <span class="bstat-value" id="hotel-guests">5</span>
        </div>
      </div>
    </div>

    <!-- Right: management panel -->
    <aside class="hotel-mgmt-panel">
      <div class="mgmt-section-title">
        <i class="fa-solid fa-arrow-up-right-dots"></i> Departments
      </div>
      <div class="dept-upgrade-list" id="dept-upgrade-list">
        <!-- Rendered by HotelUI.renderDeptPanel() -->
      </div>
    </aside>

  </div>

  <!-- ── Footer ── -->
  <footer class="shell-footer">
    Casino X · Hotel Manager · Phase 1 · For entertainment only
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HotelState.init();
      HotelUI.init();
    });
  </script>
</body>
</html>
